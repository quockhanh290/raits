<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAITS Futures Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- REPLAY data (generated by generate_replay_snapshots.py) -->
<script src="replay_snapshots_data.js"></script>
<!-- LIVE data: uncomment when IBKRBroker ready -->
<!-- <script src="live_state_data.js"></script> -->
<style>
:root {
  --bg:      #0d1117;
  --card:    #161b22;
  --border:  #30363d;
  --text:    #c9d1d9;
  --muted:   #8b949e;
  --green:   #3fb950;
  --orange:  #d29922;
  --red:     #f85149;
  --blue:    #58a6ff;
  --calm:    #3fb950;
  --normal:  #58a6ff;
  --stress:  #f85149;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; }

header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--border);
}
.header-title { font-size: 15px; font-weight: 600; color: var(--blue); }
.mode-badge {
  padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
  letter-spacing: .5px;
}
.mode-replay { background: #1f3a5f; color: var(--blue); }
.mode-live   { background: #1a3a1a; color: var(--green); }
.header-meta { color: var(--muted); font-size: 12px; }
.header-meta b { color: var(--text); }
.header-equity { font-size: 15px; font-weight: 600; }
.header-net.pos { color: var(--green); font-weight: 600; }
.header-net.neg { color: var(--red);   font-weight: 600; }
.header-regime  { font-weight: 600; }
.mode-toggle {
  margin-left: auto; padding: 3px 12px; font-size: 11px; border-radius: 6px;
  background: #21262d; color: var(--muted); border: 1px solid var(--border); cursor: pointer;
}
.mode-toggle:hover { background: #30363d; color: var(--text); }

/* ── DD SECTION ── */
#dd-section {
  padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
}
.dd-label-group { display: flex; flex-direction: column; gap: 2px; }
.dd-label-group label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.dd-pct { font-size: 26px; font-weight: 700; line-height: 1; }
.breaker-badge {
  padding: 4px 14px; border-radius: 8px; font-size: 13px; font-weight: 700;
  letter-spacing: .5px; white-space: nowrap;
}
.level-OK       { background: #1a3a1a; color: var(--green); }
.level-WARN     { background: #3a2a00; color: var(--orange); }
.level-HALT     { background: #3a0a0a; color: var(--red); animation: pulse 1s infinite; }
.level-HALT_DAY { background: #3a0a0a; color: var(--red); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }

.dd-gauge-wrap { flex: 1; min-width: 200px; }
.dd-gauge-track {
  position: relative; height: 18px; background: #21262d;
  border-radius: 4px; overflow: hidden;
}
.dd-gauge-fill { height: 100%; border-radius: 4px; transition: width .3s, background .3s; }
.dd-gauge-markers {
  position: relative; height: 14px;
  display: flex; align-items: center;
}
.dd-marker {
  position: absolute; transform: translateX(-50%);
  font-size: 10px; color: var(--muted);
}
.dd-marker.warn  { color: var(--orange); }
.dd-marker.halt  { color: var(--red); }
.dd-stats { font-size: 11px; color: var(--muted); margin-top: 4px; }
.dd-stats b { color: var(--text); }

/* ── CHART SECTION ── */
#chart-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.chart-wrap { position: relative; height: 220px; }
#slider-container { margin-top: 8px; display: flex; align-items: center; gap: 10px; }
#daySlider {
  flex: 1; accent-color: var(--blue); cursor: pointer; height: 4px;
}
#sliderLabel { font-size: 11px; color: var(--muted); white-space: nowrap; min-width: 180px; }

/* ── POSITIONS SECTION ── */
#positions-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin-bottom: 8px; }
#positions-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.cluster-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
.cluster-title { font-size: 11px; font-weight: 600; color: var(--blue); margin-bottom: 6px; text-transform: uppercase; }
.exposure-bar-track { position: relative; height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; }
.exposure-bar-fill  { height: 100%; border-radius: 4px; transition: width .3s; }
.exposure-bar-warn  { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(210,153,34,.5); }
.exposure-label { font-size: 10px; color: var(--muted); display: block; margin-top: 3px; }
.positions-list { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; }
.pos-row { display: flex; gap: 6px; align-items: center; font-size: 12px; padding: 2px 4px; background: #21262d; border-radius: 4px; }
.pos-inst { font-weight: 600; min-width: 34px; }
.pos-dir.long  { color: var(--green); font-size: 10px; }
.pos-dir.short { color: var(--red);   font-size: 10px; }
.pos-days  { color: var(--muted); font-size: 10px; }
.pos-risk  { margin-left: auto; color: var(--orange); font-size: 11px; }
.no-pos { font-size: 11px; color: var(--muted); padding: 4px 0; font-style: italic; }

/* ── DECISIONS SECTION ── */
#decisions-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.decision-day-label { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.dec-section-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin: 6px 0 3px; }
.taken-label    { color: var(--green); }
.exit-label     { color: var(--blue); }
.rejected-label { color: var(--orange); }
.halted-label   { color: var(--red); }
.dec-row { display: flex; gap: 8px; align-items: center; font-size: 12px; padding: 3px 6px; border-radius: 4px; margin: 2px 0; }
.dec-row.entered  { background: rgba(63,185,80,.08); }
.dec-row.exited   { background: rgba(88,166,255,.08); }
.dec-row.rejected { background: rgba(210,153,34,.08); }
.dec-row.halted   { background: rgba(248,81,73,.08); color: var(--red); }
.dec-cluster { color: var(--muted); font-size: 10px; }
.dec-risk    { color: var(--orange); font-size: 11px; }
.dec-from    { color: var(--muted); font-size: 10px; }
.long  { color: var(--green); }
.short { color: var(--red); }
.pos   { color: var(--green); font-weight: 600; }
.neg   { color: var(--red);   font-weight: 600; }

/* ── HEALTH SECTION ── */
#health-section { padding: 12px 16px; }
.health-grid { display: flex; gap: 20px; flex-wrap: wrap; }
.health-item { display: flex; flex-direction: column; gap: 2px; }
.health-item label { font-size: 10px; color: var(--muted); text-transform: uppercase; }
.health-item span  { font-size: 12px; color: var(--text); }

/* ── ERROR ── */
#error-banner {
  margin: 40px auto; max-width: 600px; padding: 24px;
  background: var(--card); border: 1px solid var(--red); border-radius: 8px; text-align: center;
}
#error-banner h2 { color: var(--red); margin-bottom: 10px; }
#error-banner code { background: #21262d; padding: 2px 6px; border-radius: 4px; font-family: monospace; }

@media (max-width: 700px) {
  #positions-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <span class="header-title">RAITS Futures Monitor</span>
  <span id="modeBadge" class="mode-badge mode-replay">REPLAY</span>
  <span id="headerDate" class="header-meta"><b>—</b></span>
  <span id="headerEquity" class="header-equity">—</span>
  <span id="headerNet" class="header-net pos">—</span>
  <span id="headerRegime" class="header-regime">—</span>
  <button class="mode-toggle" id="modeToggle" onclick="toggleMode()">Try LIVE</button>
</header>

<section id="dd-section">
  <div class="dd-label-group">
    <label>Drawdown</label>
    <div id="ddPct" class="dd-pct" style="color:var(--green)">—</div>
  </div>
  <div id="breakerBadge" class="breaker-badge level-OK">OK</div>
  <div class="dd-gauge-wrap">
    <div class="dd-gauge-track">
      <div id="ddFill" class="dd-gauge-fill" style="width:0%;background:var(--green)"></div>
    </div>
    <div class="dd-gauge-markers">
      <span class="dd-marker" style="left:0%">0%</span>
      <span class="dd-marker warn" id="warnMarker" style="left:66.7%">10% WARN</span>
      <span class="dd-marker halt" style="left:100%">15% HALT</span>
    </div>
    <div id="ddStats" class="dd-stats">—</div>
  </div>
</section>

<section id="chart-section">
  <div class="chart-wrap">
    <canvas id="equityChart"></canvas>
  </div>
  <div id="slider-container">
    <input type="range" id="daySlider" min="0" max="0" value="0">
    <div id="sliderLabel">—</div>
  </div>
</section>

<section id="positions-section">
  <div class="section-title">Open Positions</div>
  <div id="positionsGrid"></div>
</section>

<section id="decisions-section">
  <div class="section-title">Decisions — <span id="decisionsDate">—</span></div>
  <div id="decisionsContent"></div>
</section>

<section id="health-section">
  <div class="section-title">Runner Health</div>
  <div class="health-grid" id="healthGrid">
    <div class="health-item"><label>Last Fetch</label><span id="hLastFetch">—</span></div>
    <div class="health-item"><label>Connection</label><span id="hConn">—</span></div>
    <div class="health-item"><label>CWD</label><span id="hCwd">—</span></div>
    <div class="health-item"><label>Mode</label><span id="hMode">—</span></div>
  </div>
</section>

<div id="errorBanner" style="display:none">
  <div id="error-banner">
    <h2>No data loaded</h2>
    <p>Run the snapshot generator first:</p>
    <br>
    <code>cd D:\raits &amp;&amp; python -m global_index.generate_replay_snapshots</code>
    <br><br>
    <p>Then refresh this page.</p>
  </div>
</div>

<script>
// ── CONSTANTS ────────────────────────────────────────────────────────────
const CL_LABELS = {
  'roska4_swing':   'Rổ4 Swing',
  'roska4_stress':  'Rổ4 Stress',
  'global_nkd':     'NKD Global'
};
const CL_ORDER = ['roska4_swing', 'roska4_stress', 'global_nkd'];
const REGIME_BG = {
  Calm:    'rgba(63,185,80,0.12)',
  Normal:  'rgba(88,166,255,0.10)',
  Stress:  'rgba(248,81,73,0.14)',
  Unknown: 'rgba(48,54,61,0.3)'
};
const REGIME_COLOR = {
  Calm: '#3fb950', Normal: '#58a6ff', Stress: '#f85149', Unknown: '#8b949e'
};

// ── STATE ────────────────────────────────────────────────────────────────
let data = null;
let mode = 'replay';
let selectedIdx = 0;
let equityChart = null;
let liveTimer = null;

// ── INIT ────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  if (typeof window.LIVE_DATA !== 'undefined') {
    startLive(window.LIVE_DATA);
  } else if (typeof window.REPLAY_DATA !== 'undefined') {
    startReplay(window.REPLAY_DATA);
  } else {
    document.getElementById('errorBanner').style.display = 'block';
    document.querySelector('header').style.display = 'none';
    document.getElementById('dd-section').style.display = 'none';
    document.getElementById('chart-section').style.display = 'none';
    document.getElementById('positions-section').style.display = 'none';
    document.getElementById('decisions-section').style.display = 'none';
    document.getElementById('health-section').style.display = 'none';
  }

  document.getElementById('daySlider').addEventListener('input', e => {
    selectedIdx = parseInt(e.target.value);
    updateDayView();
    if (equityChart) equityChart.update('none');
  });
});

// ── MODE HANDLERS ────────────────────────────────────────────────────────
function startReplay(raw) {
  mode = 'replay';
  data = raw;
  selectedIdx = data.snapshots.length - 1;
  document.getElementById('modeBadge').className = 'mode-badge mode-replay';
  document.getElementById('modeBadge').textContent = 'REPLAY';
  document.getElementById('slider-container').style.display = 'flex';
  const slider = document.getElementById('daySlider');
  slider.max = data.snapshots.length - 1;
  slider.value = selectedIdx;
  buildChart();
  updateDayView();
  updateHealth({ mode: 'REPLAY', lastFetch: '—', conn: '— (offline replay)', cwd: '—' });
}

function startLive(raw) {
  mode = 'live';
  // Live data format: {meta, snapshots:[one], runner_health:{...}}
  data = { meta: raw.meta, snapshots: raw.snapshots };
  selectedIdx = 0;
  document.getElementById('modeBadge').className = 'mode-badge mode-live';
  document.getElementById('modeBadge').textContent = '● LIVE';
  document.getElementById('slider-container').style.display = 'none';
  buildChart();
  updateDayView();
  if (raw.runner_health) updateHealth(raw.runner_health);
  // Poll: check if window.LIVE_DATA updated (works after page reload;
  // for HTTP serving, replace with fetch('live_state.json') instead)
  if (liveTimer) clearInterval(liveTimer);
  liveTimer = setInterval(() => {
    if (typeof window.LIVE_DATA !== 'undefined' && window.LIVE_DATA !== raw) {
      startLive(window.LIVE_DATA);
    }
  }, 10000);
}

function toggleMode() {
  if (mode === 'replay' && typeof window.LIVE_DATA !== 'undefined') {
    startLive(window.LIVE_DATA);
  } else if (typeof window.REPLAY_DATA !== 'undefined') {
    if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
    startReplay(window.REPLAY_DATA);
  }
}

// ── CHART ────────────────────────────────────────────────────────────────
function buildChart() {
  const snaps = data.snapshots;

  const regimeBgPlugin = {
    id: 'regimeBg',
    beforeDatasetsDraw(chart) {
      const { ctx, scales, chartArea } = chart;
      if (!chartArea) return;
      const xSc = scales.x;
      const { top, bottom } = chartArea;
      let start = 0, cur = snaps[0]?.regime || 'Unknown';
      const draw = (from, to, regime) => {
        const x1 = xSc.getPixelForValue(from);
        const x2 = xSc.getPixelForValue(to) + 1;
        ctx.fillStyle = REGIME_BG[regime] || REGIME_BG.Unknown;
        ctx.fillRect(x1, top, x2 - x1, bottom - top);
      };
      for (let i = 1; i < snaps.length; i++) {
        if (snaps[i].regime !== cur) { draw(start, i - 1, cur); start = i; cur = snaps[i].regime; }
      }
      draw(start, snaps.length - 1, cur);
    }
  };

  const vlinePlugin = {
    id: 'vline',
    afterDraw(chart) {
      if (mode !== 'replay') return;
      const { ctx, scales, chartArea } = chart;
      if (!chartArea) return;
      const x = scales.x.getPixelForValue(selectedIdx);
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(x, chartArea.top);
      ctx.lineTo(x, chartArea.bottom);
      ctx.stroke();
      ctx.restore();
    }
  };

  const ctx = document.getElementById('equityChart').getContext('2d');
  if (equityChart) equityChart.destroy();
  equityChart = new Chart(ctx, {
    type: 'line',
    plugins: [regimeBgPlugin, vlinePlugin],
    data: {
      labels: snaps.map((_, i) => i),
      datasets: [
        {
          label: 'Equity ($)',
          data: snaps.map(s => s.equity),
          yAxisID: 'yEq',
          borderColor: '#58a6ff',
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0,
          fill: false
        },
        {
          label: 'Drawdown (%)',
          data: snaps.map(s => -(s.drawdown_pct * 100)),
          yAxisID: 'yDD',
          borderColor: '#f85149',
          backgroundColor: 'rgba(248,81,73,0.15)',
          borderWidth: 1,
          pointRadius: 0,
          tension: 0,
          fill: true
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: '#8b949e', boxWidth: 10, font: { size: 11 } } },
        tooltip: {
          backgroundColor: '#161b22',
          borderColor: '#30363d',
          borderWidth: 1,
          titleColor: '#c9d1d9',
          bodyColor: '#8b949e',
          callbacks: {
            title: items => snaps[items[0].dataIndex]?.date || '',
            label: item => item.datasetIndex === 0
              ? `Equity: $${item.parsed.y.toLocaleString('en-US', {maximumFractionDigits: 0})}`
              : `Drawdown: ${(-item.parsed.y).toFixed(2)}%`
          }
        }
      },
      scales: {
        x: {
          ticks: {
            color: '#8b949e',
            maxTicksLimit: 10,
            callback: (v) => snaps[v]?.date.slice(0, 7) || ''
          },
          grid: { color: '#21262d' }
        },
        yEq: {
          type: 'linear',
          position: 'left',
          ticks: { color: '#8b949e', callback: v => '$' + (v / 1000).toFixed(0) + 'k' },
          grid: { color: '#21262d' },
          title: { display: true, text: 'Equity', color: '#8b949e', font: { size: 10 } }
        },
        yDD: {
          type: 'linear',
          position: 'right',
          max: 0,
          min: -20,
          ticks: { color: '#f85149', callback: v => (-v).toFixed(0) + '%' },
          grid: { drawOnChartArea: false },
          title: { display: true, text: 'DD%', color: '#f85149', font: { size: 10 } }
        }
      }
    }
  });
}

// ── DAY VIEW ────────────────────────────────────────────────────────────
function updateDayView() {
  const snap = data.snapshots[selectedIdx];
  const meta = data.meta;
  if (!snap || !meta) return;
  renderHeader(snap, meta);
  renderDD(snap, meta);
  renderPositions(snap, meta);
  renderDecisions(snap);
  if (mode === 'replay') {
    const label = document.getElementById('sliderLabel');
    label.textContent = `Day ${selectedIdx + 1} / ${data.snapshots.length}  —  ${snap.date}`;
  }
}

function renderHeader(snap, meta) {
  document.getElementById('headerDate').innerHTML = `<b>${snap.date}</b>`;
  document.getElementById('headerEquity').textContent =
    '$' + snap.equity.toLocaleString('en-US', { maximumFractionDigits: 0 });
  const net = snap.equity - meta.account;
  const netEl = document.getElementById('headerNet');
  netEl.textContent = (net >= 0 ? '+' : '') +
    '$' + Math.abs(net).toLocaleString('en-US', { maximumFractionDigits: 0 });
  netEl.className = 'header-net ' + (net >= 0 ? 'pos' : 'neg');
  const regEl = document.getElementById('headerRegime');
  regEl.textContent = 'Regime: ' + snap.regime;
  regEl.style.color = REGIME_COLOR[snap.regime] || '#8b949e';
}

function renderDD(snap, meta) {
  const ddPct    = snap.drawdown_pct * 100;
  const hardPct  = meta.hard_dd_pct * 100;   // 15
  const warnPct  = meta.target_dd_pct * 100; // 10
  const fillPct  = Math.min(100, (ddPct / hardPct) * 100);

  let color;
  if (ddPct >= hardPct)      color = '#f85149';
  else if (ddPct >= warnPct) color = '#d29922';
  else                        color = '#3fb950';

  const ddEl = document.getElementById('ddPct');
  ddEl.textContent = ddPct.toFixed(2) + '%';
  ddEl.style.color = color;

  const fill = document.getElementById('ddFill');
  fill.style.width = fillPct + '%';
  fill.style.background = color;

  // warn marker position on bar (warnPct/hardPct = 10/15 = 66.7%)
  const wm = document.getElementById('warnMarker');
  if (wm) wm.style.left = (warnPct / hardPct * 100).toFixed(1) + '%';

  const badge = document.getElementById('breakerBadge');
  badge.textContent = snap.breaker_level;
  badge.className = 'breaker-badge level-' + snap.breaker_level;

  const peak = snap.equity + snap.drawdown_dollars;
  document.getElementById('ddStats').innerHTML =
    `Peak <b>$${peak.toLocaleString('en-US',{maximumFractionDigits:0})}</b> &nbsp;·&nbsp; ` +
    `Now <b>$${snap.equity.toLocaleString('en-US',{maximumFractionDigits:0})}</b> &nbsp;·&nbsp; ` +
    `DD today <b>$${snap.drawdown_dollars.toLocaleString('en-US',{maximumFractionDigits:0})}</b> &nbsp;·&nbsp; ` +
    `MaxDD all-time <b>$${snap.max_dd_dollars.toLocaleString('en-US',{maximumFractionDigits:0})}</b> ` +
    `<span style="color:var(--muted)">(target ≤${(meta.max_dd_dollars||meta.account*0.15).toLocaleString('en-US',{maximumFractionDigits:0})} hard)</span>`;
}

function renderPositions(snap, meta) {
  const grid = document.getElementById('positionsGrid');
  grid.innerHTML = '';
  CL_ORDER.forEach(cl => {
    const cap = meta.clusters[cl] || { max_gross_pct: 0.05, max_net_pct: null };
    const exp = snap.cluster_exposure[cl] || { gross_pct: 0, net_pct: 0 };
    const pos = snap.open_positions.filter(p => p.cluster === cl);
    const grossPct   = exp.gross_pct * 100;
    const capGrossPct = cap.max_gross_pct * 100;
    const fillPct    = Math.min(100, grossPct / capGrossPct * 100);
    const warnAtPct  = 80; // 80% of cap → warn
    let barColor = fillPct >= 90 ? '#f85149' : fillPct >= 70 ? '#d29922' : '#3fb950';

    const netStr = cap.max_net_pct !== null
      ? ` &nbsp;net ${(exp.net_pct*100).toFixed(1)}% / ${(cap.max_net_pct*100).toFixed(1)}%`
      : '';

    const posRows = pos.length === 0
      ? '<div class="no-pos">— flat —</div>'
      : pos.map(p => `
          <div class="pos-row">
            <span class="pos-inst">${p.inst}</span>
            <span class="pos-dir ${p.direction.toLowerCase()}">${p.direction}</span>
            <span class="pos-days">${p.days_held}d</span>
            <span class="pos-risk">$${p.risk_sized.toLocaleString('en-US',{maximumFractionDigits:0})}</span>
          </div>`).join('');

    const card = document.createElement('div');
    card.className = 'cluster-card';
    card.innerHTML = `
      <div class="cluster-title">${CL_LABELS[cl] || cl}</div>
      <div class="exposure-bar-track">
        <div class="exposure-bar-fill" style="width:${fillPct}%;background:${barColor}"></div>
        <div class="exposure-bar-warn" style="left:${warnAtPct}%"></div>
      </div>
      <span class="exposure-label">gross ${grossPct.toFixed(1)}% / cap ${capGrossPct.toFixed(1)}%${netStr}</span>
      <div class="positions-list">${posRows}</div>`;
    grid.appendChild(card);
  });
}

function renderDecisions(snap) {
  document.getElementById('decisionsDate').textContent = snap.date;
  const dec = snap.decision;
  let html = `<div class="decision-day-label">
    Regime: <span style="color:${REGIME_COLOR[snap.regime]}">${snap.regime}</span>
    &nbsp;·&nbsp; Realized today:
    <span class="${dec.realized_today >= 0 ? 'pos' : 'neg'}">${dec.realized_today >= 0 ? '+' : ''}$${Math.abs(dec.realized_today).toLocaleString('en-US',{maximumFractionDigits:0})}</span>
  </div>`;

  if (dec.entries.length) {
    html += '<div class="dec-section-label taken-label">ENTERED</div>';
    html += dec.entries.map(e =>
      `<div class="dec-row entered">
        <span>${e.inst}</span>
        <span class="${e.direction.toLowerCase()}">${e.direction}</span>
        <span class="dec-cluster">${CL_LABELS[e.cluster] || e.cluster}</span>
        <span class="dec-risk">risk $${e.risk_sized.toLocaleString('en-US',{maximumFractionDigits:0})}</span>
      </div>`).join('');
  }

  if (dec.exits.length) {
    html += '<div class="dec-section-label exit-label">EXITED</div>';
    html += dec.exits.map(e =>
      `<div class="dec-row exited">
        <span>${e.inst}</span>
        <span class="${e.direction.toLowerCase()}">${e.direction}</span>
        <span class="dec-cluster">${CL_LABELS[e.cluster] || e.cluster}</span>
        <span class="${e.pnl >= 0 ? 'pos' : 'neg'}">${e.pnl >= 0 ? '+' : ''}$${Math.abs(e.pnl).toLocaleString('en-US',{maximumFractionDigits:0})}</span>
        <span class="dec-from">entered ${e.entry_day}</span>
      </div>`).join('');
  }

  if (dec.rejected_detail.length) {
    html += '<div class="dec-section-label rejected-label">REJECTED — cap full</div>';
    html += dec.rejected_detail.map(r =>
      `<div class="dec-row rejected">
        <span>${r.inst}</span>
        <span class="${r.direction.toLowerCase()}">${r.direction}</span>
        <span class="dec-cluster">${CL_LABELS[r.cluster] || r.cluster}</span>
      </div>`).join('');
  }

  if (dec.halted_today > 0) {
    html += `<div class="dec-row halted">⛔ HALTED: ${dec.halted_today} ${dec.halted_today === 1 ? 'entry' : 'entries'} blocked — circuit breaker active</div>`;
  }

  if (!dec.entries.length && !dec.exits.length && !dec.rejected_detail.length && !dec.halted_today) {
    html += '<div class="no-pos">— no activity this day —</div>';
  }

  document.getElementById('decisionsContent').innerHTML = html;
}

function updateHealth(h) {
  document.getElementById('hLastFetch').textContent = h.lastFetch || h.last_update || '—';
  document.getElementById('hConn').textContent     = h.conn || h.connection || '—';
  document.getElementById('hCwd').textContent      = h.cwd || '—';
  document.getElementById('hMode').textContent     = h.mode || mode.toUpperCase();
}
